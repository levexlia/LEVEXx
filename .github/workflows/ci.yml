name: Gate 0 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Gate 0
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: levex
          POSTGRES_USER: levex
          POSTGRES_PASSWORD: levex_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U levex -d levex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://levex:levex_local@localhost:5432/levex

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Architecture check
        run: npm run architecture:check

      - name: Unit tests
        run: npm run test:unit

      - name: Run database migrations
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Secret scan
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /repo --redact --no-banner

      - name: Dependency audit
        run: npm audit
