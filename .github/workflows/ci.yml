name: LEVEX CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    name: ci / static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run architecture:check
      - run: npm run architecture:regression
  unit:
    name: ci / unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: mkdir -p evidence
      - run: npm run test:unit -- --reporter=default --reporter=junit --outputFile=evidence/unit.xml
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          if-no-files-found: error
  build:
    name: ci / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build
  security:
    name: ci / security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: mkdir -p evidence
      - name: Secret scan
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /repo --redact --no-banner --report-format json --report-path /repo/evidence/gitleaks.json
      - name: Dependency audit
        if: always()
        run: npm audit --json > evidence/npm-audit.json
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          if-no-files-found: error
  db-authz:
    name: ci / db-authz
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: levex_slice1
          POSTGRES_USER: levex_ci_admin
          POSTGRES_PASSWORD: ephemeral_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U levex_ci_admin -d levex_slice1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROVISION_DATABASE_URL: postgres://levex_ci_admin:ephemeral_ci_only@localhost:5432/levex_slice1
      DATABASE_URL: postgres://levex_ci_admin:ephemeral_ci_only@localhost:5432/levex_slice1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: mkdir -p evidence
      - name: Clean migration, security and recovery suite
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=evidence/db-authz.xml tests/db/slice1.test.mjs
      - name: Retained Gate 0 integration
        run: npm run test:integration -- --reporter=default --reporter=junit --outputFile=evidence/integration.xml
      - name: Schema evidence
        if: always()
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" pg_dump -U levex_ci_admin --schema-only levex_slice1 > evidence/schema.sql
          sha256sum evidence/schema.sql > evidence/schema.sha256
          git rev-parse HEAD > evidence/candidate-sha.txt
          node --version > evidence/node-version.txt
          npm --version > evidence/npm-version.txt
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: db-authz-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          if-no-files-found: error
  gate0-required:
    name: ci / gate0-required
    if: always()
    needs: [static, unit, db-authz, security, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every dependency to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = {'static', 'unit', 'db-authz', 'security', 'build'}
          assert set(results) == expected, 'Missing required check'
          assert all(v['result'] == 'success' for v in results.values()), 'A required check did not succeed'
          PYTHON
