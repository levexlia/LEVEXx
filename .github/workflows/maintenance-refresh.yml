name: Temporary maintenance refresh
on:
  push:
    branches:
      - feat/p02-p03-slice1-a1
permissions:
  contents: read
jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[maintenance-refresh]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Format Director delta
        run: npm exec prettier -- --write scripts/verify-architecture.mjs docs/platform/P0.2-P0.3-slice1-review-handoff.md
      - name: Refresh vulnerable transitive dependencies
        run: npm audit fix --package-lock-only
      - name: Verify refreshed lock installs
        run: npm ci
      - name: Audit high and critical
        run: npm audit --audit-level=high --json > maintenance-audit.json
      - name: Upload generated files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maintenance-refresh-${{ github.sha }}
          path: |
            package-lock.json
            scripts/verify-architecture.mjs
            docs/platform/P0.2-P0.3-slice1-review-handoff.md
            maintenance-audit.json
          if-no-files-found: error
