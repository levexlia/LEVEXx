name: Temporary maintenance apply
on:
  push:
    branches:
      - feat/p02-p03-slice1-a1
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[maintenance-apply]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Apply deterministic maintenance changes
        run: |
          npm exec prettier -- --write scripts/verify-architecture.mjs docs/platform/P0.2-P0.3-slice1-review-handoff.md
          npm audit fix --package-lock-only
          npm ci
          npm audit --audit-level=high
          git rm .github/workflows/maintenance-refresh.yml
      - name: Commit generated changes
        run: |
          git config user.name "levex-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json scripts/verify-architecture.mjs docs/platform/P0.2-P0.3-slice1-review-handoff.md
          git diff --cached --check
          git commit -m "fix: apply verified dependency and formatting refresh"
          git push origin HEAD:feat/p02-p03-slice1-a1
